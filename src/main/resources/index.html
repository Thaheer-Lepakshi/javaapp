<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Java App</title>
    <style>
        :root { color-scheme: light; font-family: Arial, sans-serif; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef3f8; color: #17202a; }
        main { width: min(560px, calc(100% - 40px)); padding: 48px; border-radius: 16px; background: white; box-shadow: 0 18px 45px rgba(23, 32, 42, .12); text-align: center; }
        h1 { margin: 0 0 12px; color: #1769aa; }
        p { margin: 0; line-height: 1.6; }
    </style>
</head>
<body>
<main>
    <h1>Hello from Java</h1>
    <p>Your Maven application is running in the browser.</p>
</main>
</body>
</html>
